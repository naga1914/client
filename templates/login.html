{% load socialaccount %}
{% providers_media_js %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {% load static %}

<link rel="icon" type="image/png" href="{% static 'images/logo.jpeg' %}">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
            Welcome Back
        </h2>

        {% if error %}
        <div class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Email
                </label>
                <input type="email" name="email" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Password
                </label>
                <input type="password" name="password" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
                Login
            </button>
        </form>
         <div class="my-6 flex items-center">
    <div class="flex-grow border-t border-gray-300"></div>
    <span class="mx-4 text-gray-500 text-sm">OR</span>
    <div class="flex-grow border-t border-gray-300"></div>
</div>

<div class="space-y-3">

    <a href="{% provider_login_url 'google' %}"
       class="flex items-center justify-center gap-3 w-full border border-gray-300 bg-white py-3 rounded-lg hover:bg-gray-50 transition">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg"
             alt="Google" class="w-5 h-5">
        <span class="font-medium text-gray-700">
            Continue with Google
        </span>
    </a>

</div>
        
        <p class="text-sm text-center text-gray-500 mt-6">
            Don’t have an account? <a href="{% url 'register' %}" class="text-blue-600 hover:underline">Register</a>
        </p>

    </div>

</body>
</html>
