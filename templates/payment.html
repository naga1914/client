<!DOCTYPE html>
<html>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- Success Icon -->

        ✅
    </div>

    <!-- Title -->
    <h1 class="text-3xl font-bold text-green-600 mb-4">
        Payment Successful

    <!-- Message -->
    <p class="text-gray-600 mb-6">

        Your payment has been successfully processed.
    </p>

    <!-- Button -->
    <a href="{% url 'home' %}"
       class="inline-block bg-purple-700 hover:bg-purple-800 text-white px-6 py-3 rounded-lg transition">
        Back to Home
    </a>

</div>

</body>
</html>
